<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Аудит «Настроек» — 158 вопросов</title>
<style>
:root{
  --bg:#0b0b0d; --panel:#151518; --panel2:#1d1d21; --line:#2a2a30;
  --txt:#f2f2f4; --dim:#a2a2ad; --dim2:#6f6f7a; --acc:#1BA1E2;
  --ok:#3ecf8e; --warn:#f0b429;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);
  font:15px/1.5 -apple-system,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
.top{position:sticky;top:0;z-index:20;background:rgba(11,11,13,.96);
  border-bottom:1px solid var(--line);padding:12px 16px 10px;backdrop-filter:blur(10px)}
.brand{display:flex;align-items:baseline;gap:8px;font-weight:600;font-size:15px;letter-spacing:.2px}
.brand span{color:var(--dim2);font-weight:400;font-size:11.5px}
.progrow{display:flex;align-items:center;gap:10px;margin:8px 0 6px}
.bar{flex:1;height:6px;background:var(--panel2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
.pcount{font:12px/1 ui-monospace,Menlo,monospace;color:var(--dim);white-space:nowrap}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--txt);border-radius:8px;
  padding:6px 9px;font-size:12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#3b3b44}
.btn.on{border-color:var(--acc);color:#bfe6f8}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#04121a;font-weight:600}
.btn.ghost{background:transparent}
select,input.search{background:var(--panel);border:1px solid var(--line);color:var(--txt);
  border-radius:8px;padding:6px 8px;font-size:12.5px;max-width:100%}
input.search{flex:1;min-width:120px}
.wrap{padding:14px 16px 120px;max-width:900px;margin:0 auto}
.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 10px}
.q.answered{border-color:#2f4a3a}
.q.hidden{display:none}
.qhead{display:flex;gap:10px;align-items:baseline}
.n{font:700 13px/1.6 ui-monospace,Menlo,monospace;color:var(--acc);min-width:30px}
.qtitle{font-size:15.5px;font-weight:600;line-height:1.35}
.meta{color:var(--dim2);font-size:11px;margin:3px 0 8px 40px;word-break:break-word}
.problem{color:#dedee4;margin:0 0 10px 40px;font-size:14px}
.opts{display:grid;gap:5px;margin-left:40px}
.opt{display:flex;gap:9px;align-items:flex-start;border:1px solid transparent;border-radius:8px;
  padding:7px 9px;cursor:pointer;background:var(--panel2);font-size:13.5px;line-height:1.35}
.opt:hover{border-color:#3b3b44}
.opt.sel{border-color:var(--acc);background:#0f2634}
.opt .k{font:700 13px/1.4 ui-monospace,Menlo,monospace;color:var(--acc);width:12px;flex:0 0 12px}
.opt .t{flex:1}
.chip{margin-left:auto;flex:0 0 auto;font-size:10px;color:var(--warn);border:1px solid #4a3a12;
  background:#241d08;border-radius:99px;padding:1px 6px;white-space:nowrap}
.rec{margin:9px 0 0 40px;font-size:12px;color:var(--dim)}
.rec b{color:var(--warn);font-weight:600}
.imp{margin:2px 0 0 40px;font-size:11px;color:var(--dim2)}
.empty{padding:28px;text-align:center;color:var(--dim2)}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(11,11,13,.97);
  border-top:1px solid var(--line);padding:8px 12px;display:flex;gap:6px;align-items:center;
  flex-wrap:wrap;backdrop-filter:blur(10px)}
.foot .grow{flex:1;font:11.5px/1.3 ui-monospace,Menlo,monospace;color:var(--dim);min-width:90px}
.outwrap{position:fixed;left:0;right:0;bottom:54px;z-index:29;padding:0 12px;display:none}
.outwrap.show{display:block}
textarea{width:100%;height:88px;background:#101014;border:1px solid var(--line);color:#d9f2ff;
  border-radius:10px;padding:8px;font:11.5px/1.45 ui-monospace,Menlo,monospace;resize:vertical}
.hint{color:var(--dim2);font-size:10.5px;margin-top:4px}
kbd{background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;
  padding:0 3px;font:10.5px ui-monospace,Menlo,monospace}
@media (min-width:760px){
  .wrap{padding:18px 22px 140px}
  .qtitle{font-size:16px}
  .problem{font-size:14.5px}
}
</style>
</head>
<body>

<div class="top">
  <div class="brand">Аудит «Настроек» <span>158 вопросов · 0.19.4 · iPhone 4</span></div>
  <div class="progrow">
    <div class="bar"><i id="bar"></i></div>
    <div class="pcount" id="stat">0 / 158</div>
  </div>
  <div class="toolbar">
    <select id="blockSel" title="перейти к блоку"></select>
    <input class="search" id="search" placeholder="поиск: номер, заголовок, экран…">
    <button class="btn primary" id="fill">Подставить рекомендации</button>
    <button class="btn ghost" id="unanswered">Неотвеченные</button>
    <button class="btn ghost" id="onlyChanged">Только изменения</button>
    <button class="btn ghost" id="clear">Сбросить</button>
  </div>
</div>

<div class="wrap"><div id="list"></div></div>

<div class="outwrap" id="outwrap"><textarea id="out" readonly placeholder="здесь появится строка ответов"></textarea></div>

<div class="foot">
  <div class="grow" id="fstat">отвечено 0 из 158</div>
  <button class="btn primary" id="copy">Скопировать</button>
  <button class="btn" id="copyAll">Все 158</button>
  <button class="btn ghost" id="toggleOut">Строка</button>
</div>

<script>
const Q = [{"n":1,"title":"Высота шапки и отступ до первой строки","screen":"все страницы","files":"root-dump.txt, WIFI-dump.txt, General-dump.txt","problem":"Шапка фиксирована 76 pt, а первая строка начинается то на 126 pt (30 pt зазора), то на 144 pt (48 pt): Wi-Fi/корень/Приватность — 126, Основные/Звуки/Заметки — 144.","options":[{"k":"A","t":"оставить как есть"},{"k":"B","t":"единый зазор 30 pt на всех страницах"},{"k":"C","t":"48 pt везде"},{"k":"D","t":"считать зазор от кегля заголовка (52 → 30, 30 → 48)"}],"rec":"B","recText":"30 pt даёт плотный WP-список, а 48 pt оставляет «дыру» на коротких страницах.","impact":"30 экранов.","block":"1. Шапка и навигация"},{"n":2,"title":"У заголовка нет правого поля","screen":"все страницы","files":"root-dump.txt `(16,4 304×66)`, Notifications-dump.txt `(40,4 280×66)`","problem":"Метка всегда заканчивается ровно на 320 pt: в корне 16+304, на подстраницах 40+280; на Store текст доходит до 286 pt (запас 34), на длинной локализации запас исчезнет и текст упрётся в самый край.","options":[{"k":"A","t":"оставить (запас 34 pt есть)"},{"k":"B","t":"отнять 12 pt справа (`ширина − 12`)"},{"k":"C","t":"ужимать с запасом 20 pt"}],"rec":"B","recText":"одно число, одинаковый воздух справа на всех заголовках.","impact":"30 экранов.","block":"1. Шапка и навигация"},{"n":3,"title":"Заголовок страницы берётся из `navigationItem.title`, который тут же гасится","screen":"все страницы","files":"MPSettingsHooks.xm:70–90, Reminders-dump.txt","problem":"Код запоминает заголовок в associated object и обнуляет `navigationItem.title`; на «Напоминаниях» шапка отрисовалась как «заметки» — то есть взят заголовок предыдущей страницы (содержимое — своё, шапка — чужая).","options":[{"k":"A","t":"оставить"},{"k":"B","t":"хранить заголовок в отдельном поле контроллера и не трогать `navigationItem`"},{"k":"C","t":"брать `controller.title` без обнуления"}],"rec":"B","recText":"снимает класс ошибок «шапка от прошлой страницы».","impact":"30 экранов.","block":"1. Шапка и навигация"},{"n":4,"title":"Шеврон «‹» — 40 pt Light, штрих ~2 pt","screen":"все подстраницы","files":"root-dump.txt (скрыт), WIFI-top.png","problem":"Кадр `(6,6 30×66)`, цвет акцентный, на чёрном читается как волосяная линия; на корне скрыт.","options":[{"k":"A","t":"оставить"},{"k":"B","t":"48 pt Medium"},{"k":"C","t":"акцентный квадрат 29×31 с «‹»"},{"k":"D","t":"текстом «назад» 12 pt"}],"rec":"B","recText":"крупнее и плотнее, остаётся в WP-логике «глиф + заголовок».","impact":"29 экранов.","block":"1. Шапка и навигация"},{"n":5,"title":"Текст заголовка «пляшет» на 24 pt между корнем и подстраницей","screen":"все страницы","files":"root-dump.txt `(16,4)`, WIFI-dump.txt `(40,4)`","problem":"Без шеврона заголовок на 16 pt, с шевроном — на 40 pt; при переходе корень → раздел шапка прыгает вправо.","options":[{"k":"A","t":"оставить"},{"k":"B","t":"всегда 40 pt (место под шеврон резервировать)"},{"k":"C","t":"всегда 16 pt, шеврон рисовать поверх"}],"rec":"B","recText":"заголовок перестаёт дёргаться, шеврон всегда на месте.","impact":"30 экранов.","block":"1. Шапка и навигация"},{"n":6,"title":"Кнопка «Изменить» — 12 pt системным bold в навбаре над шапкой","screen":"Уведомления","files":"Notifications-top.png","problem":"Текст 12 pt bold в правом верхнем углу на высоте 44 pt (кегль не задан, берётся системный для `UIBarButtonItem`); визуально это единственный элемент в навбаре, он «висит» над огромным заголовком.","options":[{"k":"A","t":"оставить"},{"k":"B","t":"15 pt"},{"k":"C","t":"перенести в шапку справа от заголовка"},{"k":"D","t":"lowercase «изменить» 15 pt"}],"rec":"C","recText":"WP держит действия в одной строке с заголовком, а не отдельным баром.","impact":"4 экрана с кнопками (Уведомления, правка списков, панель MetroPhone, страницы твиков).","block":"1. Шапка и навигация"},{"n":7,"title":"Навбар 44 pt сдвигает весь контент","screen":"Уведомления","files":"Notifications-top.png, Notifications-dump.txt","problem":"При наличии кнопок таблица начинается с 64 pt вместо 20, шапка уезжает вниз, первая строка — на 244 pt (против 126 на Wi-Fi).","options":[{"k":"A","t":"оставить"},{"k":"B","t":"оставлять навбар, но шапку ставить под него с тем же зазором 30 pt"},{"k":"C","t":"убрать навбар, кнопку рисовать в шапке"}],"rec":"C","recText":"один вертикальный ритм на всех страницах.","impact":"4 экрана.","block":"1. Шапка и навигация"},{"n":8,"title":"Вся шапка — кнопка «назад»","screen":"все подстраницы","files":"MPSettingsHeaderView.m:44–47","problem":"Тап по любому месту заголовка (включая пустое справа) возвращает назад; визуально об этом говорит только шеврон, на корне шапка не кликабельна.","options":[{"k":"A","t":"оставить"},{"k":"B","t":"только зона шеврона"},{"k":"C","t":"оставить + подпись «назад» под заголовком"}],"rec":"A","recText":"на iPhone 4 крупная зона попадания удобнее, менять нечего.","impact":"29 экранов.","block":"1. Шапка и навигация"},{"n":9,"title":"Строчные буквы убивают регистр брендов","screen":"Wi-Fi, iCloud, Bluetooth","files":"WIFI-top.png, iCloud-top.png","problem":"`lowercaseString` превращает «Wi-Fi» в «wi-fi», «iCloud» в «icloud»; на iOS это выглядит как опечатка, а не стиль.","options":[{"k":"A","t":"оставить"},{"k":"B","t":"список исключений (Wi-Fi, iCloud, VPN, App Store)"},{"k":"C","t":"только первая буква заглавная"}],"rec":"B","recText":"5 строк-исключений, зато бренды не выглядят сломанными.","impact":"6 экранов (Wi-Fi, iCloud, Bluetooth, VPN, App Store, FaceTime).","block":"1. Шапка и навигация"},{"n":10,"title":"Минимальный кегль заголовка 30 pt даёт «мелкий» заголовок на длинных именах","screen":"Основные, Яркость и обои","files":"General-top.png","problem":"«яркость и обои» (13 знаков) ужимается с 52 до ~34 pt, «основные» остаётся 52 — заголовки страниц разного размера.","options":[{"k":"A","t":"оставить"},{"k":"B","t":"минимум 38 pt + обрезка"},{"k":"C","t":"перенос на две строки"}],"rec":"B","recText":"держит единый масштаб, длинные имена встречаются редко.","impact":"30 экранов.","block":"1. Шапка и навигация"},{"n":11,"title":"У шапки нет нижней границы","screen":"все страницы","files":"root-top.png","problem":"На длинных страницах список начинается сразу под заголовком без линии/отступа, на «Уведомлениях» текст группы почти касается заголовка.","options":[{"k":"A","t":"оставить"},{"k":"B","t":"линия 1 pt белый 10 %"},{"k":"C","t":"отступ 8 pt без линии"}],"rec":"B","recText":"тонкая линия отделяет шапку от списка, не добавляя «карточности».","impact":"30 экранов.","block":"1. Шапка и навигация"},{"n":12,"title":"Шапка уезжает вместе с контентом","screen":"все страницы","files":"Яркость и обои","problem":"При прокрутке заголовок уходит вверх и не возвращается; в WP заголовок страницы тоже скроллится, так что это осознанно — но на «Яркости» шапка уходит раньше, чем появляется ползунок.","options":[{"k":"A","t":"оставить"},{"k":"B","t":"липкая шапка 44 pt при прокрутке"},{"k":"C","t":"липкая только строка с кнопками"}],"rec":"A","recText":"WP 8.1 скроллит заголовок, это канон.","impact":"30 экранов.","block":"1. Шапка и навигация"},{"n":13,"title":"Высота строки 56 / 57 / 58 pt","screen":"все страницы","files":"General-dump.txt, iCloud-dump.txt, Wallpaper-dump.txt","problem":"Хук возвращает 56, но `PSSwitchTableCell` меряется как 57, а iCloud — 58 (округление + 1 pt разделителя); на одной странице соседние строки разной высоты.","options":[{"k":"A","t":"оставить"},{"k":"B","t":"жёстко 56 для всех (включая свитч-ячейки)"},{"k":"C","t":"57 везде"},{"k":"D","t":"отдать высоту системе и не трогать"}],"rec":"B","recText":"одна цифра, список перестаёт «дышать».","impact":"30 экранов.","block":"2. Строки списка"},{"n":14,"title":"Подзаголовок в 4 pt от низа строки","screen":"все строки с подзаголовком","files":"root-dump.txt `(6,34 278×18)`","problem":"Заголовок 7…37, подзаголовок 34…52, до низа 56 остаётся 4 pt; при системном шрифте ниже 13 pt подзаголовок начинает касаться разделителя.","options":[{"k":"A","t":"оставить"},{"k":"B","t":"   if (onlyUnanswered && answers[q.n]) return false;
  if (onlyChanged && isKeep(q)) return false;
  if (search && !(q.n + " " + q.title + " " + q.screen + " " + q.block).toLowerCase().includes(search)) return false;
  return true;
}

function render(){
  const frag = document.createDocumentFragment();
  Q.forEach(q => {
    const el = document.createElement("section");
    el.className = "q" + (answers[q.n] ? " answered" : "") + (visible(q) ? "" : " hidden");
    el.id = "q" + q.n;
    el.innerHTML =
      '<div class="qhead"><div class="n">' + q.n + '</div><div class="qtitle">' + esc(q.title) + '</div></div>' +
      '<div class="meta">' + esc(q.screen) + ' · ' + esc(q.files) + '</div>' +
      '<p class="problem">' + esc(q.problem) + '</p>' +
      '<div class="opts">' + q.options.map(o =>
        '<label class="opt ' + (answers[q.n] === o.k ? "sel" : "") + '" data-n="' + q.n + '" data-k="' + o.k + '">' +
        '<span class="k">' + o.k + '</span><span class="t">' + esc(o.t) + '</span>' +
        (q.rec === o.k ? '<span class="chip">рекомендую</span>' : '') + '</label>').join("") + '</div>' +
      '<div class="rec"><b>Рекомендация: ' + (q.rec || "—") + '</b> — ' + esc(q.recText) + '</div>' +
      '<div class="imp">Влияние: ' + esc(q.impact) + '</div>';
    frag.appendChild(el);
  });
  list.innerHTML = "";
  list.appendChild(frag);
  list.querySelectorAll(".opt").forEach(o => o.addEventListener("click", () => pick(+o.dataset.n, o.dataset.k)));
  if (!Q.some(visible)) list.innerHTML = '<div class="empty">Ничего не найдено — сбросьте фильтр.</div>';
  updateStats();
}

function pick(n, k){
  if (answers[n] === k) delete answers[n]; else answers[n] = k;
  localStorage.setItem(KEY, JSON.stringify(answers));
  const q = document.getElementById("q" + n);
  if (q){
    q.classList.toggle("answered", !!answers[n]);
    q.querySelectorAll(".opt").forEach(o => o.classList.toggle("sel", o.dataset.k === answers[n]));
  }
  updateStats();
}

function updateStats(){
  const done = Object.keys(answers).length;
  document.getElementById("stat").textContent = done + " / " + Q.length;
  document.getElementById("fstat").textContent = "отвечено " + done + " из " + Q.length;
  document.getElementById("bar").style.width = (done / Q.length * 100) + "%";
  [...document.getElementById("blockSel").options].forEach(op => {
    const b = op.value; if (!b) return;
    const qs = Q.filter(q => q.block === b), d = qs.filter(q => answers[q.n]).length;
    op.textContent = b.replace(/^\d+\.\s*/, "") + "  " + d + "/" + qs.length;
  });
}

function buildBlocks(){
  const sel = document.getElementById("blockSel");
  const blocks = [...new Set(Q.map(q => q.block))];
  sel.innerHTML = '<option value="">все блоки</option>' +
    blocks.map(b => '<option value="' + esc(b) + '">' + esc(b.replace(/^\d+\.\s*/, "")) + '</option>').join("");
  sel.addEventListener("change", () => {
    if (!sel.value) return;
    const first = Q.find(q => q.block === sel.value);
    document.getElementById("q" + first.n).scrollIntoView({behavior:"smooth", block:"start"});
  });
}

const out = document.getElementById("out");
const outwrap = document.getElementById("outwrap");
function showOut(s){
  out.value = s; outwrap.classList.add("show");
  navigator.clipboard && navigator.clipboard.writeText(s);
}
function answerString(all){
  return Q.filter(q => all || answers[q.n]).map(q => q.n + answers[q.n]).join(" ");
}

document.getElementById("fill").onclick = () => {
  Q.forEach(q => { if (q.rec) answers[q.n] = q.rec; });
  localStorage.setItem(KEY, JSON.stringify(answers)); render();
};
document.getElementById("clear").onclick = () => {
  answers = {}; localStorage.setItem(KEY, "{}"); render();
};
document.getElementById("unanswered").onclick = e => {
  onlyUnanswered = !onlyUnanswered; e.currentTarget.classList.toggle("on", onlyUnanswered); render();
};
document.getElementById("onlyChanged").onclick = e => {
  onlyChanged = !onlyChanged; e.currentTarget.classList.toggle("on", onlyChanged); render();
};
document.getElementById("search").oninput = e => { search = e.target.value.toLowerCase().trim(); render(); };
document.getElementById("copy").onclick = () => showOut(answerString(false));
document.getElementById("copyAll").onclick = () => showOut(answerString(true));
document.getElementById("toggleOut").onclick = () => outwrap.classList.toggle("show");

document.addEventListener("keydown", e => {
  if (["INPUT","TEXTAREA","SELECT"].includes(e.target.tagName)) return;
  const vis = Q.filter(visible);
  if (!vis.length) return;
  const el = document.querySelector(".q:hover");
  const n = el ? +el.id.replace("q","") : vis[0].n;
  if (/^[a-dA-D]$/.test(e.key)) pick(n, e.key.toUpperCase());
  else if (e.key === "j" || e.key === "ArrowDown") jump(n, 1, vis);
  else if (e.key === "k" || e.key === "ArrowUp") jump(n, -1, vis);
  else if (e.key === "Enter") jump(n, 1, vis);
});
function jump(n, dir, vis){
  const i = vis.findIndex(q => q.n === n);
  const t = vis[Math.min(vis.length - 1, Math.max(0, i + dir))];
  if (t) document.getElementById("q" + t.n).scrollIntoView({behavior:"smooth", block:"center"});
}

buildBlocks(); render();
</script>
</body>
</html>
